name: birdcam
channels:
  - defaults
  - conda-forge
dependencies:
  # Core Python - using defaults channel for better macOS tkinter support
  - python=3.11
  - python.app  # macOS framework build for GUI support

  # Graphics and visualization libraries
  - tk
  - pillow
  - cairo
  - cairocffi
  - cairosvg
  - graphviz  # System library for rendering
  - python-graphviz  # Python package for graphviz

  # Python package management
  - pip
  - setuptools
  - wheel

  # Additional dependencies from pip
  - pip:
      - altgraph==0.17.4
      - macholib==1.16.3
      - packaging==25.0
      - pyinstaller==6.16.0
      - pyinstaller-hooks-contrib==2025.9
